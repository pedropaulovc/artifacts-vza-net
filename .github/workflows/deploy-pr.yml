name: Deploy pull request

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: deploy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PREVIEW_WORKER_NAME: artifacts-vza-net-pr-${{ github.event.pull_request.number }}

jobs:
  verify:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install source dependencies
        working-directory: source
        run: npm ci --ignore-scripts
      - name: Verify tests
        working-directory: source
        run: npm test
      - name: Verify types
        working-directory: source
        run: npm run typecheck

  deploy:
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-ppe
      url: https://artifacts-vza-net-pr-${{ github.event.pull_request.number }}.artifacts-ppe-vza-net.workers.dev
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
      - name: Check out trusted deployment files
        uses: actions/checkout@v4
        with:
          ref: main
          path: deploy
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - name: Install trusted Wrangler
        working-directory: deploy
        run: npm ci --ignore-scripts
      - name: Verify target account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: test "$CLOUDFLARE_ACCOUNT_ID" = "b84c535427bb541a804d4055918a94ab"
      - name: Deploy PR Worker
        working-directory: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy ../source/src/index.ts --config wrangler.ppe.jsonc --name "$PREVIEW_WORKER_NAME"

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloudflare-ppe
    steps:
      - name: Verify target account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: test "$CLOUDFLARE_ACCOUNT_ID" = "b84c535427bb541a804d4055918a94ab"
      - name: Delete PR Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request DELETE \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/${PREVIEW_WORKER_NAME}?force=true" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json")"
          if [[ "$status" == 2?? ]]; then
            echo "Deleted ${PREVIEW_WORKER_NAME}."
            rm -f "$response_file"
            exit 0
          fi
          if [[ "$status" == "404" ]]; then
            echo "${PREVIEW_WORKER_NAME} was already absent."
            rm -f "$response_file"
            exit 0
          fi
          cat "$response_file"
          rm -f "$response_file"
          printf 'Cloudflare cleanup failed with HTTP %s\n' "$status" >&2
          exit 1
